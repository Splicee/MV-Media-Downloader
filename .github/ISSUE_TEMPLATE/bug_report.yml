name: Hlášení chyby
description: Problém v MV Media Downloaderu
title: "[Chyba] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Co se stalo
      description: Stručně popište očekávané a skutečné chování.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostický report
      description: Vložte očištěný report, který aplikace připravila do schránky.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Kontrola soukromí
      options:
        - label: Zkontroloval(a) jsem, že report neobsahuje údaje, které nechci zveřejnit.
          required: true
