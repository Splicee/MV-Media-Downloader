name: Vydání

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag vydání, například v3.5.0
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Nastavit .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Obnovit
        run: dotnet restore "MV Media Downloader.sln"
      - name: Sestavit
        run: dotnet build "MV Media Downloader.sln" --configuration Release --no-restore
      - name: Funkční testy
        run: dotnet run --project "tests/MVMediaStudio.Tests/MVMediaStudio.Tests.csproj" --configuration Release --no-build --no-restore
      - name: Self-test aktualizátoru
        run: dotnet run --project "updater/MVMediaStudio.Updater/MVMediaStudio.Updater.csproj" --configuration Release --no-build --no-restore -- --self-test
      - name: XAML a motivy
        run: dotnet run --project "tests/MVMediaStudio.UiSmoke/MVMediaStudio.UiSmoke.csproj" --configuration Release --no-build --no-restore
      - name: Balíček
        run: dotnet publish "packaging/MVMediaStudio.Distribution/MVMediaStudio.Distribution.csproj" --configuration Release --no-restore
      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/MV-Media-Downloader-win-x64.zip", "release/MV-Media-Downloader-win-x64.zip.sha256")
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view "$env:RELEASE_TAG" *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorActionPreference
          if ($releaseExists) {
            gh release upload "$env:RELEASE_TAG" $assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $assets --title "MV Media Downloader $env:RELEASE_TAG" --generate-notes --verify-tag
          }
