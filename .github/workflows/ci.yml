name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Nastavit .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Kontrola zdrojů
        shell: pwsh
        run: |
          $extensions = @(".cs", ".xaml", ".xml", ".json", ".yml", ".yaml", ".ps1", ".cmd", ".md", ".py", ".txt", ".csproj", ".sln")
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $extensions -contains $_.Extension.ToLowerInvariant() -and
            $_.FullName -notmatch "\\(dist|release|artifacts|bin|obj|\.git)\\"
          }
          $leaks = $files | Select-String -Pattern "AIza[0-9A-Za-z_-]{20,}"
          if ($leaks) {
            $leaks | ForEach-Object { Write-Error "Podezřelý klíč v $($_.Path):$($_.LineNumber)" }
            exit 1
          }
          $plugin = Get-Content "yt-dlp-plugins/mv-joj-play/yt_dlp_plugins/extractor/jojplay.py" -Raw
          if ($plugin -notmatch "_REFRESH_TOKEN" -or $plugin -notmatch "refresh_token" -or $plugin -notmatch "_TOKEN_EXPIRES_AT") {
            throw "JOJ konektor nemá obnovu relace."
          }
      - name: Obnovit
        run: dotnet restore "MV Media Downloader.sln"
      - name: Sestavit
        run: dotnet build "MV Media Downloader.sln" --configuration Release --no-restore
      - name: Funkční testy
        run: dotnet run --project "tests/MVMediaStudio.Tests/MVMediaStudio.Tests.csproj" --configuration Release --no-build --no-restore
      - name: Self-test aktualizátoru
        run: dotnet run --project "updater/MVMediaStudio.Updater/MVMediaStudio.Updater.csproj" --configuration Release --no-build --no-restore -- --self-test
      - name: XAML a motivy
        run: dotnet run --project "tests/MVMediaStudio.UiSmoke/MVMediaStudio.UiSmoke.csproj" --configuration Release --no-build --no-restore
      - name: Publikovatelné sestavení
        run: dotnet publish "packaging/MVMediaStudio.Distribution/MVMediaStudio.Distribution.csproj" --configuration Release --no-restore --property:CreateReleaseArchive=false
